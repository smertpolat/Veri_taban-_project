name: otel

services:
  backend:
    build: ./backend
    environment:
      OTEL_DB_URL: jdbc:postgresql://host.docker.internal:5432/otel_db
      OTEL_DB_USER: postgres
      OTEL_DB_PASSWORD: ${OTEL_DB_PASSWORD:?Set OTEL_DB_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

  database-ui:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: host.docker.internal
    ports:
      - "127.0.0.1:8081:8080"
